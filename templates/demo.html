{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>🤖 AI Message Demo</h1>
    <form method="POST">
        <input name="name" placeholder="Enter customer name">
        <button class="btn">Generate AI Message</button>
    </form>
    {% if message %}
    <div style="background:rgba(34,197,94,0.3); padding:1.5rem; border-radius:12px; margin-top:1.5rem; border-left:4px solid #22c55e;">
        <h3>✨ Generated Message:</h3>
        <p>"{{ message }}"</p>
    </div>
    {% endif %}
</div>
{% endblock %}
